name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  server:
    name: Server tests
    # 服务端是 Windows 专用（ctypes.windll + SendInput），用 Windows 跑更贴近实际
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 服务端测试
        working-directory: server
        shell: pwsh
        run: |
          # test_integration.py 会起真实的 server.py 子进程并走真实 CLI，
          # 是「状态可观测」这条需求的最终验收，不能省。
          $files = @(
            'test_tcp_server.py',   # 分帧与连接生命周期
            'test_handlers.py',     # 握手、配对令牌、字段校验
            'test_state.py',        # 连接状态机与状态快照
            'test_runtime.py',      # 数据目录、单实例、原子写、日志
            'test_control.py',      # 本机控制通道
            'test_tray.py',         # 托盘图标的 Win32 结构体与图标文件
            'test_server_ui.py',    # GUI 纯逻辑
            'test_integration.py'   # 端到端：真进程 + 真 CLI
          )
          foreach ($f in $files) {
            Write-Host "=== $f ==="
            python $f
            if ($LASTEXITCODE -ne 0) { throw "$f 失败（退出码 $LASTEXITCODE）" }
          }

      # 打包脚本是发布流程的唯一入口，它坏了整个发布就不可信。
      - name: 安装打包依赖
        run: python -m pip install pyinstaller

      - name: 打包脚本冒烟测试
        shell: pwsh
        run: |
          ./scripts/package.ps1 -Target server

          $zip = Get-ChildItem dist/omnipad-server-v*.zip | Sort-Object Name | Select-Object -Last 1
          if (-not $zip) { throw '打包脚本没有产出 dist/omnipad-server-v<版本>.zip' }
          Write-Host "产出：$($zip.Name)（$($zip.Length) 字节）"

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [System.IO.Compression.ZipFile]::OpenRead($zip.FullName)
          $names = $archive.Entries | ForEach-Object { $_.FullName }
          $archive.Dispose()

          # 回归守卫：历史上每个发布包都混进了 test_client.py 和 0 字节的 __init__.py
          $leaked = $names | Where-Object { $_ -match '(^|/)test_.*\.py$' -or $_ -match '(^|/)__init__\.py$' }
          if ($leaked) { throw "发布包混入了开发文件：$($leaked -join ', ')" }

          $required = @(
            'server.py', 'server_ui.py', 'handlers.py', 'pairing.py', 'tcp_server.py',
            'input_controller.py', 'protocol.py', 'state.py', 'runtime.py', 'control.py',
            'tray.py', 'assets/omnipad.ico',
            'OmniPad-Server.exe', 'OmniPad-Server-CLI.exe'
          )
          foreach ($name in $required) {
            if ($names -notcontains $name) { throw "发布包缺少 $name" }
          }
          Write-Host "内容检查通过：$($names.Count) 个条目"

          # 可复现构建：同样的源码两次打包必须产出完全相同的字节，否则发布说明里的
          # SHA256 就没有意义。exe 尤其容易漂 —— PyInstaller 内部用 set 收集模块，
          # PYTHONHASHSEED 不固定时两次构建能差出一千多字节。
          $first = (Get-FileHash $zip.FullName -Algorithm SHA256).Hash
          ./scripts/package.ps1 -Target server | Out-Null
          $second = (Get-FileHash $zip.FullName -Algorithm SHA256).Hash
          if ($first -ne $second) { throw "打包不可复现：$first != $second" }
          Write-Host "可复现构建通过：$first"

  client:
    name: Client compile & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # 只编译，不签名：CI 里没有 keystore.properties
      - name: 编译 debug
        working-directory: client
        run: ./gradlew :app:compileDebugKotlin --console=plain --stacktrace

      # 用 assembleRelease 而不是 compileReleaseKotlin：前者会真正跑 R8 压缩
      # 与 lintVital，这两件事只在打包时发生，光编译是验不到的。
      # 没有 keystore.properties 时产出的是未签名包，CI 不需要签名。
      - name: 打包 release（未签名，含 R8 与 lint）
        working-directory: client
        run: ./gradlew :app:assembleRelease --console=plain --stacktrace

      # 协议编解码与连接层的单元测试，跑在普通 JVM 上
      - name: 单元测试
        working-directory: client
        run: ./gradlew :app:testDebugUnitTest --console=plain --stacktrace

      - name: 上传测试报告
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: client-test-report
          path: client/app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore
